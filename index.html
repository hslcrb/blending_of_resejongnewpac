<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#f4f3ef">
        <meta name="description" content="세종문화회관의 외관을 둘러보는 3D 모델">
        <title>세종문화회관 | 건축 둘러보기</title>
        <style>
            .github-octocat-badge {
                position: fixed;
                right: 16px;
                bottom: 16px;
                z-index: 60;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 13px 8px 11px;
                border-radius: 999px;
                background: #24292f;
                color: #ffffff;
                font: 600 13px/1.2 system-ui, -apple-system, "Malgun Gothic", sans-serif;
                text-decoration: none;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
                opacity: 0.92;
            }
            .github-octocat-badge:hover,
            .github-octocat-badge:focus-visible {
                opacity: 1;
            }
            .github-octocat-badge svg {
                width: 20px;
                height: 20px;
                fill: currentColor;
                flex: none;
            }
            html[data-embed="1"] .github-octocat-badge {
                display: none;
            }
        </style>
    </head>
